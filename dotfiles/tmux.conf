# ===== General =====
set -g mouse on
# 50k scrollback gets expensive once agent TUIs flood panes; 20k is plenty.
set -g history-limit 20000
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
# Agents thrash pane titles (spinners); keep window names stable.
set -g automatic-rename off
set -g allow-rename off
# Block OSC title updates from pane programs (Grok/Claude spinners). Stops the
# ~2Hz title thrash that makes multi-pane agent layouts flicker in iTerm.
set -g allow-set-title off
set -g set-titles off

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB"

# Windows/panes start at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# ===== Prefix: Ctrl-a (instead of Ctrl-b) =====
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ===== Reload config =====
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ===== Pane splitting (opens in the current pane's working directory) =====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ===== Vi mode =====
setw -g mode-keys vi

# vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-style pane resizing: prefix + H/J/K/L (repeatable while held)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi-style copy mode, yanking to the macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# (paste stays on tmux's default `]` — no need to shadow `p`, which is previous-window)

# ===== Plugins (managed by TPM, ~/.tmux/plugins/tpm) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

# Capturing full scrollback on every continuum save is costly with agent panes.
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
# Minutes between auto-saves (continuum still probes via status-interval).
set -g @continuum-save-interval '30'

# ===== Catppuccin theme =====
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Window tabs show index + directory basename, truncated to 18 chars (+ …)
# so long repo names don't crowd the left side.
set -g @catppuccin_window_default_text " #{=/18/…:#{b:pane_current_path}}"
set -g @catppuccin_window_current_text " #{=/18/…:#{b:pane_current_path}}"

# Load catppuccin BEFORE composing the status line so @thm_* / modules exist.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# ===== Status bar layout =====
set -g status-position bottom
# 5s forked git+continuum on a multi-agent layout; 15s is plenty for clock/git.
set -g status-interval 15
set -g status-right-length 150
set -g status-left-length 60

# Left: session pill.
set -g status-left "#{E:@catppuccin_status_session} "

# Right: git (self-hiding pill) · directory · clock.
#   git   = custom dependency-free segment (~/.config/tmux/git-status.sh)
#   dir   = blue pill with the active pane's path (home-relative)
#   clock = surface pill, HH:MM
set -g status-right "#(~/.config/tmux/git-status.sh '#{pane_current_path}') "
set -ga status-right "#[fg=#89b4fa,bg=default]#[fg=#11111b,bg=#89b4fa]  #{s|#{HOME}|~|:pane_current_path} #[fg=#89b4fa,bg=default] "
set -ga status-right "#[fg=#585b70,bg=default]#[fg=#cdd6f4,bg=#585b70]  %H:%M #[fg=#585b70,bg=default]"

# ===== Per-pane labels (only when a window is split) =====
# Index + command + basename only (full paths churn the redraw on every title tick).
# Active pane is teal + bold; inactive panes are dimmed.
set -g pane-border-format " #{?pane_active,#[fg=#94e2d5#,bold],#[fg=#6c7086]}#P #{pane_current_command}#[default] #[fg=#585b70]#{b:pane_current_path} "
set -g pane-border-style "fg=#313244"          # dim border for inactive panes
set -g pane-active-border-style "fg=#94e2d5"   # teal border for the active pane

# Show the labels ONLY when the window has more than one pane (no clutter on a
# single full-screen pane). Default is OFF; the hook flips a window to `top`
# on split and back to `off` when it returns to a single pane.
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'

# extrakto: open in the visible pane, not the full-scrollback firehose
set -g @extrakto_grab_area "window recent"

# Block copy: prefix + p → fzf popup of joined (unwrapped) scrollback.
# Tab to mark multiple lines, Enter copies them clean to the macOS clipboard.
# ctrl-a marks everything. Solves copying multi-line output without pane-width breaks.
bind C-p display-popup -E -w 90% -h 90% "tmux capture-pane -pJ -S -5000 | fzf --multi --no-sort --tac --bind 'ctrl-a:select-all' | pbcopy"

run '~/.tmux/plugins/tpm/tpm'

# Post-plugin overrides (tmux-sensible resets status-interval to 5 otherwise).
set -g status-interval 15
set -g history-limit 20000
set -g automatic-rename off
set -g allow-rename off
set -g allow-set-title off

# Keep tmux copy-mode readable and stop wheel-up from scrolling TUI apps.
set -g mode-style "fg=#11111b,bg=#f9e2af,bold"
bind -T root WheelUpPane select-pane -t= \; copy-mode -e -t=
bind -T copy-mode-vi WheelUpPane select-pane -t= \; send-keys -X -t= -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane -t= \; send-keys -X -t= -N 5 scroll-down
bind -T copy-mode WheelUpPane select-pane -t= \; send-keys -X -t= -N 5 scroll-up
bind -T copy-mode WheelDownPane select-pane -t= \; send-keys -X -t= -N 5 scroll-down
